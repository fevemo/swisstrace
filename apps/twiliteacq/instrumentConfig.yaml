# instrumentConfig.yaml — the twilite this installation talks to.
#
# This file travels with the instrument PC, not with the source code.

twilite:
  host: "10.0.52.25"
  port: 23
  # Seconds without an answer before the connection counts as lost.
  timeout_s: 5.0
  # Reconnect attempts after a lost connection, during an acquisition.
  reconnectAttempts: 3
  # Folder of the acquisition files (*.csv); "~" is the home folder. Empty: "data" in the
  # app folder when run from the repository, "~/Twilite" when installed.
  dataDir: ""
  # Keep every byte exchanged with the device: in <dataDir>/rawlogs from the repository,
  # beside the log when installed.
  rawLog: true

  # true: start a simulated twilite inside the app and connect to it instead.
  simulate: true
  simulator:
    scenario: "bolus"               # background, bolus, calibration-step, long-decay
    isotope: "F-18"
    idleTimeout_s: 19.0             # drop an idle connection, as the device does; 0: never
    port: 0                         # 0: any free port
