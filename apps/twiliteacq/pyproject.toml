# The EINstudio acquisition app. It is a folder EINstudio launches (main.py), not an
# installable package, so uv only installs its dependencies.

[project]
name = "twiliteacq"
version = "0.1.0"
description = "Twilite acquisition app (EINstudio)"
requires-python = ">=3.12"
dependencies = [
    "twilite",
    "einstudio>=0.3.1",
    "numpy>=2.0",
]

[tool.uv]
package = false
