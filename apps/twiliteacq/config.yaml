# Application
layoutFile:  'layouts/mainLayout.py'
docPath:     '../../doc/build/html'

# Instrument configuration
useInstrumentConfig:  true
instrumentConfigFile: 'instrumentConfig.yaml'

# Options panel (unused: the controls are built in layouts/mainLayout.py)
useOptions:  false
optionsFile: ''

# Logging
useLogger:  true
logFile:    'log.txt'
logLevel:   'INFO'
logFormat:  '%(asctime)s %(levelname)s - %(message)s'

# Main window
mainWindowTitle:    'Twilite'
mainWindowMinSizeX: 1100
mainWindowMinSizeY: 760
# Leave blank to use the EINstudio icon. Point it at a .ico or .png in the app
# folder to brand the window, the taskbar and the desktop shortcut.
# On macOS, main.py uses icons/icon.icns instead (the Dock wants Apple's margin).
mainWindowIcon:     'icons/icon.ico'

# Splash screen (shown while the app loads)
useSplash:   true
# Leave blank for a generated title card: the window title in the palette's colours.
splashImage: ''

# Appearance
fluentTheme:  'DARK'
chromeMode:   'native'
color:        'obsidian_teal'
shape:        'twiliteacq'
