[project]
name = "twilite"
version = "0.1.0"
description = "Qt-free driver and simulator for the Swisstrace twilite coincidence counter"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "Felipe Velasquez", email = "fmoros@student.ethz.ch" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
twilite-sim = "twilite.sim.__main__:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
